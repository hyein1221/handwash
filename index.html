<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>손씻기 게임🧼</title>
<meta name="theme-color" content="#f5fbff" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
<style>
  :root {
    --line:#cddfee;
    --text:#1d2b3a;
    --p1:#79c8ff;
    --p2:#ff9ecd;
    --tile-bg:#ffffff;
    --tile-border:#cddfee;
    --special-start:#e8fff1;
    --special-goal:#fff7d9;
    --bg:#f5fbff;
    --panel-bg:#ffffff;
    --accent-blue:#13506f;
    --accent-pink:#7a1d1d;
  }

  * { box-sizing:border-box; }

  body {
    font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 80px;
    gap: 12px;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    margin: 0;
    line-height:1.4;
  }

  .subtitle {
    font-size: .8rem;
    text-align:center;
    color:#4e6b86;
    line-height:1.4;
  }

  .layout {
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
    max-width:950px;
  }
  @media(min-width:768px){
    .layout {
      flex-direction:row;
      align-items:flex-start;
    }
  }

  /* BOARD AREA */
  .board-wrapper {
    flex:1 1 auto;
    display:flex;
    justify-content:center;
  }

  .board {
    width: min(80vw,480px);
    height: min(80vw,480px);
    background:#fff;
    border: 2px solid var(--line);
    border-radius: 16px;
    box-shadow:0 20px 40px rgba(0,0,0,.05);
    position: relative;
    display:grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    gap:4px;
    padding:8px;
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e9f6ff 80%);
    font-size:10px;
  }

  /* 기본 타일 */
  .tile {
    background:var(--tile-bg);
    border:2px solid var(--tile-border);
    border-radius:10px;
    padding:4px;
    font-size:10px;
    font-weight:600;
    line-height:1.2;
    color:#1d2b3a;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  /* START/GOAL 칸 강조 */
  .start-tile {
    background:var(--special-start);
    border-color:#9fe1ad;
    color:#2f6f33;
  }
  .goal-tile {
    background:var(--special-goal);
    border-color:#ffd36a;
    color:#6a4a00;
  }

  /* 가운데(보드 내부)는 비워두기 */
  .empty {
    background:transparent;
    border:none;
    box-shadow:none;
    pointer-events:none;
  }

  /* 중앙 라벨: 로고 + 타이틀 */
  .center-label{
    position:absolute;
    top:50%;
    left:50%;
    width:70%;
    max-width:240px;
    transform:translate(-50%,-50%);
    text-align:center;
    background:#ffffffcc;
    border:2px solid var(--line);
    border-radius:12px;
    box-shadow:0 16px 32px rgba(0,0,0,.07);
    padding:12px;
  }
  .center-logo-wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .center-logo-wrap img {
    max-width:80px;
    height:auto;
    display:block;
  }
  .center-main-title{
    font-weight:600;
    font-size:14px;
    line-height:1.4;
    color:#1d2b3a;
  }
  .center-sub{
    font-size:10px;
    color:#4e6b86;
    line-height:1.4;
    white-space:pre-line;
  }

  /* player tokens (bigger now) */
  .player-token {
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 4px 8px rgba(0,0,0,.25);
    font-size:10px;
    font-weight:700;
    color:#1d2b3a;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .p1 { background:var(--p1); }
  .p2 { background:var(--p2); }

  /* index badge on tile */
  .idx {
    position:absolute;
    top:2px;
    left:4px;
    font-size:8px;
    line-height:1;
    opacity:.4;
    font-weight:600;
  }

  .label-text {
    font-size:10px;
    font-weight:600;
    text-align:center;
    line-height:1.3;
  }

  /* SIDE PANEL */
  .panel {
    flex:0 1 280px;
    background:var(--panel-bg);
    border:2px solid var(--line);
    border-radius:16px;
    box-shadow:0 20px 40px rgba(0,0,0,.05);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:16px;
    font-size:12px;
    line-height:1.4;
  }

  .section-title {
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    color:#234;
  }

  .row {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
  }

  /* 주사위 시각영역 */
  .dice-visual {
    width:40px;
    height:40px;
    border-radius:8px;
    background:#fff;
    border:2px solid var(--line);
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:0; /* hide text */
  }
  .die-face {
    width:24px;
    height:24px;
    position:relative;
  }
  .pip {
    width:6px;
    height:6px;
    background:#1d2b3a;
    border-radius:50%;
    position:absolute;
  }
  /* positions for pip dots (like a real die) */
  .pip.p1 { top:50%; left:50%; transform:translate(-50%,-50%); }
  .pip.p2a { top:4px; left:4px; }
  .pip.p2b { bottom:4px; right:4px; }
  .pip.p3a { top:4px; left:4px; }
  .pip.p3b { top:50%; left:50%; transform:translate(-50%,-50%); }
  .pip.p3c { bottom:4px; right:4px; }
  .pip.p4a { top:4px; left:4px; }
  .pip.p4b { top:4px; right:4px; }
  .pip.p4c { bottom:4px; left:4px; }
  .pip.p4d { bottom:4px; right:4px; }
  .pip.p5a { top:4px; left:4px; }
  .pip.p5b { top:4px; right:4px; }
  .pip.p5c { bottom:4px; left:4px; }
  .pip.p5d { bottom:4px; right:4px; }
  .pip.p5e { top:50%; left:50%; transform:translate(-50%,-50%); }
  .pip.p6a { top:4px; left:4px; }
  .pip.p6b { top:4px; right:4px; }
  .pip.p6c { top:50%; left:4px; transform:translateY(-50%); }
  .pip.p6d { top:50%; right:4px; transform:translateY(-50%); }
  .pip.p6e { bottom:4px; left:4px; }
  .pip.p6f { bottom:4px; right:4px; }

  /* roll animation (shake) */
  .rolling {
    animation: shake 0.4s infinite;
  }
  @keyframes shake {
    0%   { transform: rotate(0deg)   scale(1); }
    25%  { transform: rotate(10deg)  scale(1.05); }
    50%  { transform: rotate(0deg)   scale(1); }
    75%  { transform: rotate(-10deg) scale(1.05); }
    100% { transform: rotate(0deg)   scale(1); }
  }

  #rollBtn{
    background:#1d90ff;
    border:none;
    color:#fff;
    font-size:12px;
    font-weight:600;
    line-height:1;
    padding:10px 12px;
    border-radius:10px;
    box-shadow:0 8px 16px rgba(29,144,255,.3);
    cursor:pointer;
  }
  #rollBtn:disabled {
    opacity:.5;
    cursor:default;
  }
  #rollBtn:active{
    transform:translateY(1px);
    box-shadow:0 4px 8px rgba(29,144,255,.2);
  }

  .players-status{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .player-card{
    flex:1 1 125px;
    background:#f9f9fb;
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px;
    line-height:1.4;
    min-width:125px;
  }
  .player-head{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
    font-size:11px;
  }
  .dot{
    width:12px;
    height:12px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .dot.p1{ background:var(--p1); }
  .dot.p2{ background:var(--p2); }

  .turn-indicator{
    font-size:11px;
    color:#4e6b86;
  }

  .message-box{
    background:#fffef5;
    border:2px solid #ffe9a9;
    border-radius:12px;
    padding:12px;
    font-size:11px;
    line-height:1.4;
    min-height:70px;
  }
  .message-title{
    font-weight:600;
    margin-bottom:4px;
    color:#6a4a00;
    font-size:11px;
  }
  .message-body{
    color:#4a3a00;
    white-space:pre-line;
  }

  /* MODAL POPUP (퀴즈) */
  .modal-overlay{
    position:fixed;
    left:0;top:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);
    display:none;
    justify-content:center;
    align-items:center;
    padding:16px;
    z-index:900;
  }
  .modal{
    background:#fff;
    border-radius:16px;
    max-width:320px;
    width:100%;
    border:2px solid var(--line);
    box-shadow:0 24px 48px rgba(0,0,0,.25);
    padding:16px;
    font-size:14px;
    line-height:1.4;
    position:relative;
    z-index:901;
  }
  .modal-title{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
  }
  .modal-question{
    font-size:13px;
    line-height:1.5;
    margin-bottom:12px;
    white-space:pre-line;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
  }
  .choice-btn{
    border:2px solid var(--line);
    border-radius:10px;
    padding:10px;
    background:#fff;
    font-size:13px;
    text-align:left;
    cursor:pointer;
  }
  .choice-btn.correct{
    border-color:#43c16b;
    background:#e8fff1;
    color:#1c5a2e;
    font-weight:600;
  }
  .choice-btn.wrong{
    border-color:#ff7d7d;
    background:#fff1f1;
    color:#7a1d1d;
    font-weight:600;
  }
  .modal-feedback{
    font-size:12px;
    line-height:1.4;
    min-height:32px;
    color:#4e6b86;
    white-space:pre-line;
    margin-bottom:12px;
  }
  .close-btn{
    width:100%;
    background:#1d90ff;
    color:#fff;
    border:none;
    font-size:13px;
    font-weight:600;
    line-height:1;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    text-align:center;
  }
  .close-btn:active{
    transform:translateY(1px);
    box-shadow:0 4px 8px rgba(29,144,255,.4);
  }

  /* 폭죽 이펙트 */
  .fireworks {
    position:fixed;
    left:0;top:0;right:0;bottom:0;
    pointer-events:none;
    overflow:hidden;
    z-index:950;
    display:none;
  }
 .burst {
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  animation: pop 700ms ease-out forwards;
}
@keyframes pop {
  0%   { transform:translate(0,0) scale(1); opacity:1; }
  100% { transform:translate(var(--dx),var(--dy)) scale(0.2); opacity:0; }
}

  /* Footer info */
  .footer-info {
    margin-top:16px;
    font-size:11px;
    text-align:center;
    color:#4e6b86;
    line-height:1.5;
  }

</style>
</head>
<body>
<h1>손씻기 게임🧼</h1>
<div class="subtitle">
  주사위를 굴려 앞으로 이동해요.<br/>
  도착한 칸의 손씻기 퀴즈에 답해볼까요?
</div>

<div class="layout">
  <!-- BOARD -->
  <div class="board-wrapper">
    <div class="board" id="board">
      <!-- 중앙 라벨 -->
      <div class="center-label">
        <div class="center-logo-wrap">
          <img src="./rogo_1.png" alt="질병관리청 국민소통단 로고" />
          <div class="center-main-title">손 씻기 게임</div>
          <div class="center-sub">
            흐르는 물에 비누로 30초 🧼
            손바닥 → 손등 → 손가락 사이 </br>  → 손톱 밑 → 엄지 → 손목
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="panel">
    <div class="section-title">🎲 주사위 & 진행</div>

    <div class="row" style="align-items:flex-start;">
      <div>주사위:</div>
      <div class="dice-visual" id="diceBox">
        <div class="die-face" id="dieFace"></div>
      </div>
      <button id="rollBtn">주사위 굴리기</button>
    </div>

    <div class="row">
      <div>현재 차례:</div>
      <div class="dice-visual" style="width:48px;height:32px;">
        <div style="font-size:14px;font-weight:600;color:#1d2b3a;" id="currentPlayerBox">P1</div>
      </div>
    </div>

    <div class="players-status">
      <div class="player-card">
        <div class="player-head">
          <div class="dot p1"></div>
          <div>P1 (파랑)</div>
        </div>
        <div class="turn-indicator">위치: <span id="p1PosText">0</span> 칸</div>
      </div>

      <div class="player-card">
        <div class="player-head">
          <div class="dot p2"></div>
          <div>P2 (핑크)</div>
        </div>
        <div class="turn-indicator">위치: <span id="p2PosText">0</span> 칸</div>
      </div>
    </div>

    <div class="section-title">📢 현재 칸</div>
    <div class="message-box">
      <div class="message-title" id="messageTitle">게임 시작</div>
      <div class="message-body" id="messageBody">
        START 칸입니다.
        주사위를 눌러 이동해요!
      </div>
    </div>
  </div>
</div>

<div class="footer-info">
  제작자: 질병관리청 국민소통단 9기 김혜인<br/>
  문의: hyein_1221@hanmail.net
</div>

<!-- MODAL: 퀴즈 팝업 -->
<div class="modal-overlay" id="quizModal">
  <div class="modal">
    <div class="modal-title" id="quizTitle">퀴즈 제목</div>
    <div class="modal-question" id="quizQuestion">질문 내용</div>
    <div class="choices" id="choicesContainer"></div>
    <div class="modal-feedback" id="quizFeedback"></div>
    <button class="close-btn" id="closeQuizBtn">닫기</button>
  </div>
</div>

<!-- 폭죽 -->
<div class="fireworks" id="fireworks"></div>

<!-- 이동 효과음 (짧은 클릭 사운드 base64) -->
<audio id="stepSound">
  <source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA//////////////////////////////8AAAAALGF2YQAAAA8AAAACAAACcQCA//////////////////////////////8AAAAA" type="audio/mp3">
</audio>

<script>
/* ======================================================
   경로 정의 (보드 테두리 한 바퀴)
   ======================================================

5x5 그리드의 인덱스: row*5 + col
우리는 오른쪽 아래 모서리(4,4)에서 출발해서
시계방향으로 한 바퀴 도는 느낌 대신,
우리가 정의한 순서대로만 이동하면 돼.

pathOrder[0] = START 위치 gridIndex(4,4)=24
...
마지막 pathOrder[15] = gridIndex(3,4)=19
그 다음 다시 START(24)로 오면 GOAL 처리.
*/
const pathOrder = [
  24,23,22,21,20,15,10,5,0,1,2,3,4,9,14,19
];
// 총 16칸. 한 바퀴 돌고 다시 24로 돌아오면 완주.

const tilesData = [
  {
    label:"START",
    start:true,
    quiz:{
      title:"시작!",
      question:"깨끗한 손으로 건강 지키기 모험을 시작해요!",

      answerIndex:null,

  {

      type:"mcq",
      choices:["밥 먹기 전","장난감 보기 전"],
      answerIndex:0,
      feedback:"식사나 간식 전에는 손을 깨끗하게 씻어요 🍽"
    }
  },
  {
    label:"화장실 다녀온 후에는?",
    quiz:{
      title:"화장실 다녀온 후에는?",

      type:"ox",
      choices:["O (맞아요)","X (아니에요)"],
      answerIndex:1,

    }
  },
  {
    label:"비누가 왜 필요할까?",
    quiz:{
      title:"비누가 왜 필요할까?",
      question:"세균을 잘 없애주는 것은?\n1) 비누와 물\n2) 바람 쐬기",
      type:"mcq",
      choices:["비누와 물","바람 쐬기"],
      answerIndex:0,
      feedback:"흐르는 물 + 비누로 문질문질 해야 세균이 잘 떨어져요 🧼💦"
    }
  },
  {
    label:"기침 후에는?",
    quiz:{
      title:"기침 후에는?",
      question:"내가 손으로 입을 가리고 기침했어요.\n그 다음 해야 할 일은?",
      type:"mcq",
      choices:["손씻기","아무 것도 안 하기"],
      answerIndex:0,

    }
  },
  {
    label:"콧물 닦은 후에는?",
    quiz:{
      title:"콧물 닦은 후에는?",
      question:"콧물을 닦았을 땐?\n1) 그냥 놀이 계속하기\n2) 손을 씻기",
      type:"mcq",
      choices:["그냥 놀이 계속하기","손을 씻기"],
      answerIndex:1,
      feedback:"콧물 닦은 뒤엔 손을 깨끗하게 씻어야 해요 👃🧼"
    }
  },
  {
    label:"바깥놀이 후에는?",
    quiz:{
      title:"바깥놀이 후에는?",
      question:"바깥놀이 후에는?\nO) 손씻기\nX) 그냥 간식 먹기",
      type:"ox",
      choices:["O 손씻기","X 그냥 먹기"],
      answerIndex:0,
      feedback:"바깥놀이 후엔 손을 씻고 눈·입을 만지지 않아요 🛝"
    }
  },
  {
    label:"동물을 만진 후에는?",
    quiz:{
      title:"강아지 쓰담쓰담🐶",
      question:"강아지/고양이 만진 뒤, 바로 음식을 먹어도 될까?",
      type:"mcq",
      choices:["응 괜찮아","아니, 손씻고 먹어야 해"],
      answerIndex:1,
      feedback:"동물 만진 뒤엔 꼭 손을 씻고 음식을 만져요 🐶🧼"
    }
  },
  {
    label:"어떻게 손을 씻지?",

/* ======================================================
   보드 DOM 만들기
   ====================================================== */
const boardEl = document.getElementById("board");

// 25칸(5x5) 기본 empty로 깔고
for(let cell=0; cell<25; cell++){
  const d=document.createElement("div");
  d.classList.add("tile","empty");
  d.dataset.gridIndex = cell; // 0~24
  boardEl.appendChild(d);
}

// pathOrder에 실제 칸 채우기 + START/GOAL 스타일
for(let step=0; step<pathOrder.length; step++){
  const gridIdx = pathOrder[step];
  const tileEl = boardEl.querySelector(`[data-grid-index="${gridIdx}"]`);
  tileEl.classList.remove("empty");
  if(step===0){
    tileEl.classList.add("start-tile");
  }
  if(step===pathOrder.length-1){
    tileEl.classList.add("goal-tile");
  }
  const idxDiv=document.createElement("div");
  idxDiv.classList.add("idx");
  idxDiv.textContent = step;
  tileEl.appendChild(idxDiv);

  const labelDiv=document.createElement("div");
  labelDiv.classList.add("label-text");
  labelDiv.textContent = tilesData[step].label;
  tileEl.appendChild(labelDiv);
}

/* ======================================================
   게임 상태
   ====================================================== */
let currentPlayer = 1; // 1 or 2
let pos = {1:0, 2:0};  // path index 위치 (0~15)
let finished = {1:false, 2:false};
let gameOver = false;
let rolling = false;

const dieFaceEl = document.getElementById("dieFace");
const rollBtn = document.getElementById("rollBtn");
const currentPlayerBox = document.getElementById("currentPlayerBox");

const p1PosText = document.getElementById("p1PosText");
const p2PosText = document.getElementById("p2PosText");

const messageTitle = document.getElementById("messageTitle");
const messageBody = document.getElementById("messageBody");

const quizModal = document.getElementById("quizModal");
const quizTitle = document.getElementById("quizTitle");
const quizQuestion = document.getElementById("quizQuestion");
const quizFeedback = document.getElementById("quizFeedback");
const choicesContainer = document.getElementById("choicesContainer");
const closeQuizBtn = document.getElementById("closeQuizBtn");

const fireworksEl = document.getElementById("fireworks");
const stepSound = document.getElementById("stepSound");

/* ======================================================
   주사위 그리기
   ====================================================== */
function renderDieFace(n){
  // n:1~6
  // dieFaceEl 안에 pip DOM 다시 넣기
  dieFaceEl.innerHTML = "";
  const face = document.createElement("div");
  face.className = "die-face";
  if(n===1){
    face.innerHTML = `<div class="pip p1"></div>`;
  }else if(n===2){
    face.innerHTML = `<div class="pip p2a"></div><div class="pip p2b"></div>`;
  }else if(n===3){
    face.innerHTML = `<div class="pip p3a"></div><div class="pip p3b"></div><div class="pip p3c"></div>`;
  }else if(n===4){
    face.innerHTML = `<div class="pip p4a"></div><div class="pip p4b"></div><div class="pip p4c"></div><div class="pip p4d"></div>`;
  }else if(n===5){
    face.innerHTML = `<div class="pip p5a"></div><div class="pip p5b"></div><div class="pip p5c"></div><div class="pip p5d"></div><div class="pip p5e"></div>`;
  }else if(n===6){
    face.innerHTML = `<div class="pip p6a"></div><div class="pip p6b"></div><div class="pip p6c"></div><div class="pip p6d"></div><div class="pip p6e"></div><div class="pip p6f"></div>`;
  }
  dieFaceEl.appendChild(face);
}

/* ======================================================
   플레이어 말 렌더링
   ====================================================== */
function renderPlayers(){
  // 기존 토큰 제거
  document.querySelectorAll(".player-token").forEach(n=>n.remove());

  [1,2].forEach(p=>{
    const pathIdx = pos[p];
    const gridIdx = pathOrder[pathIdx];
    const tileEl = boardEl.querySelector(`[data-grid-index="${gridIdx}"]`);
    if(!tileEl) return;
    const token=document.createElement("div");
    token.classList.add("player-token", p===1?"p1":"p2");

    if(p===1){
      token.style.bottom="4px";
      token.style.left="4px";
      token.textContent="1";
    } else {
      token.style.top="4px";
      token.style.right="4px";
      token.textContent="2";
    }

    tileEl.appendChild(token);
  });

  p1PosText.textContent = pos[1];
  p2PosText.textContent = pos[2];
  currentPlayerBox.textContent = currentPlayer===1?"P1":"P2";
}

/* ======================================================
   폭죽 이펙트
   ====================================================== */
function makeFireworkBurst(x, y) {
  // 더 크게 팡! 터뜨리기
  const particleCount = 28; // 기존 12 → 28
  for (let i = 0; i < particleCount; i++) {
    const dot = document.createElement("div");
    dot.className = "burst";

    // 조각(컨페티) 조금 더 크게
    dot.style.width = "10px";
    dot.style.height = "10px";
    dot.style.borderRadius = "3px"; // 살짝 네모 느낌 주면 진짜 컨페티 같이 보여

    // 각도 랜덤
    const angle = Math.random() * Math.PI * 2;

    // 훨씬 멀리 날아가게 (원래 60~90px 정도였음)
    const dist = 120 + Math.random() * 80; // 120~200px

    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;

    dot.style.left = x + "px";
    dot.style.top = y + "px";
    dot.style.setProperty("--dx", dx + "px");
    dot.style.setProperty("--dy", dy + "px");

    // 색 더 튀게 (HSL → 높은 채도)
    dot.style.background = `hsl(${Math.floor(Math.random()*360)},90%,60%)`;

    fireworksEl.appendChild(dot);

    // 자동 제거
    setTimeout(() => dot.remove(), 800);
  }
}

function firework() {
  fireworksEl.style.display = "block";
  const { innerWidth: w, innerHeight: h } = window;

  // 가운데 + 양옆 + 위쪽도 팡팡
  makeFireworkBurst(w * 0.5, h * 0.3);
  makeFireworkBurst(w * 0.3, h * 0.35);
  makeFireworkBurst(w * 0.7, h * 0.35);
  makeFireworkBurst(w * 0.4, h * 0.2);
  makeFireworkBurst(w * 0.6, h * 0.2);

  // 화면을 약간 더 오래 유지해서 애들이 확인할 시간 주기
  setTimeout(() => {
    fireworksEl.style.display = "none";
  }, 1000);
}


/* ======================================================
   퀴즈 모달
   ====================================================== */
function openQuizModal(quiz, celebrate){
  quizModal.style.display="flex";
  quizTitle.textContent = quiz.title;
  quizQuestion.textContent = quiz.question;
  quizFeedback.textContent = "";
  choicesContainer.innerHTML = "";

  // 축하 플래그(정답 맞으면 폭죽) 초기화
  let answered = false;

  if(quiz.type==="info"){
    closeQuizBtn.textContent="확인";
  }else{
    closeQuizBtn.textContent="닫기";
  }

  quiz.choices.forEach((choiceText, idx)=>{
    const btn=document.createElement("button");
    btn.classList.add("choice-btn");
    btn.textContent = choiceText;

    btn.addEventListener("click",()=>{
      if(answered) return;
      answered=true;
      const correct = (idx===quiz.answerIndex);
      if(correct){
        btn.classList.add("correct");
        quizFeedback.textContent = quiz.feedback || "정답!";
        // 축하 폭죽
        firework();
      }else{
        btn.classList.add("wrong");
        quizFeedback.textContent = "다시 생각해볼까?\n" + (quiz.feedback||"");
      }
    });

    choicesContainer.appendChild(btn);
  });

  // info 타입일 경우에도 완주나 특별 상황에는 폭죽 가능
  if(quiz.type==="info" && celebrate){
    firework();
  }
}

function openFinalModal(){
  quizModal.style.display="flex";
  quizTitle.textContent = finalPopup.title;
  quizQuestion.textContent = finalPopup.question;
  quizFeedback.textContent = finalPopup.feedback;
  choicesContainer.innerHTML = "";
  closeQuizBtn.textContent="완료";
  firework();
}

/* 닫기 버튼 */
closeQuizBtn.addEventListener("click",()=>{
  quizModal.style.display="none";
});

/* 칸 도착 후 처리 */
function arriveTile(player){
  const step = pos[player];
  const tileInfo = tilesData[step];

  // 사이드 패널 메시지 갱신
  messageTitle.textContent = tileInfo.label;
  messageBody.textContent = tileInfo.quiz.feedback || tileInfo.quiz.question || "";

  // 퀴즈 모달 띄우기
  openQuizModal(tileInfo.quiz, false);
}

/* ======================================================
   이동 애니메이션 (한 칸씩 딱딱딱 이동)
   ====================================================== */
function animateMove(player, steps, onDone){
  // steps만큼 1칸씩 이동
  // 마지막 도착 후 arriveTile 호출
  if(steps<=0){
    // 아무 이동도 없으면 그냥 도착 처리
    arriveTile(player);
    if(onDone) onDone();
    return;
  }

  let moved = 0;

  function stepOnce(){
    if(moved>=steps){
      // 다 이동 끝!
      // 도착한 칸 확인
      arriveTile(player);
      if(onDone) onDone();
      return;
    }

    // 다음 칸으로 실제 1칸 이동
    pos[player]++;

    // path 마지막을 넘는 경우 -> 한 바퀴 돌고 다시 START(=finish)
    if(pos[player] > pathOrder.length-1){
      pos[player] = 0;
      finished[player]=true;
      renderPlayers();
      openFinalModal(); // 손씻기 6단계 안내 + 폭죽
      if(onDone) onDone();
      return;
    }

    renderPlayers();
    // 이동마다 효과음
    try {
      stepSound.currentTime = 0;
      stepSound.play().catch(()=>{});
    } catch(e){}

    moved++;
    setTimeout(stepOnce, 250); // 한 칸 이동 템포
  }

  stepOnce();
}

/* ======================================================
   주사위 굴리기 애니메이션 + 이동 처리
   ====================================================== */
function rollDiceAndMove(){
  if(gameOver || rolling) return;
  rolling = true;
  rollBtn.disabled = true;

  // 굴리는 동안 랜덤 숫자 흔들기
  const startTime = Date.now();
  const rollDuration = 1000; // 1초 정도 굴리는 느낌
  const diceBox = document.getElementById("diceBox");
  diceBox.classList.add("rolling");

  function animFrame(){
    const elapsed = Date.now()-startTime;
    const tempVal = Math.floor(Math.random()*6)+1;
    renderDieFace(tempVal);

    if(elapsed < rollDuration){
      requestAnimationFrame(animFrame);
    }else{
      // 최종 값 확정
      const finalVal = Math.floor(Math.random()*6)+1;
      renderDieFace(finalVal);
      diceBox.classList.remove("rolling");

      // 이제 이동 애니메이션
      const thisPlayer = currentPlayer;
      animateMove(thisPlayer, finalVal, ()=>{
        // 이동 후 턴 넘기기 / 게임종료 확인
        if(finished[1] && finished[2]){
          gameOver=true;
        }
        // 턴 변경
        currentPlayer = (currentPlayer===1)?2:1;
        renderPlayers();
        rollBtn.disabled = false;
        rolling = false;
      });
    }
  }
  animFrame();
}

/* ======================================================

   ====================================================== */
renderDieFace(1);

/* 버튼 이벤트 */
rollBtn.addEventListener("click", rollDiceAndMove);
